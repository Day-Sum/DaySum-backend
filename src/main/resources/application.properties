spring.application.name=DaySum

# -----------------------------------------------------------------------------
# MySQL / JPA
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DaySum?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=${JPA_BATCH_FETCH_SIZE:100}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.jackson.time-zone=Asia/Seoul

server.forward-headers-strategy=framework


# -----------------------------------------------------------------------------
# JWT
# -----------------------------------------------------------------------------
jwt.secret=${JWT_SECRET}


# -----------------------------------------------------------------------------
# Kakao OAuth2
# -----------------------------------------------------------------------------
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-authentication-method=none
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id


# -----------------------------------------------------------------------------
# Kakao Local API
# -----------------------------------------------------------------------------
kakao.local.api.key=${KAKAO_LOCAL_API_KEY}

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.env=${SERVER_ENV:local}
server.url=${SERVER_URL:http://localhost:8080}